<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Trénerský denník</title>
<meta name="theme-color" content="#E9ECEF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1215" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Denník">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
/* Layout concept: jeden stĺpec ako zápisník na tréningovej podlahe. Rozdelenie hrubými čiarami, klienti ako kotúče (farby olympijských kotúčov), progres ako čistý graf. */
:root {
  --bg: #E9ECEF;
  --surface: #F7F8F9;
  --ink: #12171C;
  --muted: #56616C;
  --line: #CDD3D9;
  --accent: #1F4CC4;
  --accent-ink: #FFFFFF;
  --good: #18784A;
  --bad: #B8302B;
  --plate-red: #C62F2A;
  --plate-blue: #2653C7;
  --plate-yellow: #E3B51C;
  --plate-green: #2C8A55;
  --plate-white: #ECEFF2;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --font-body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1215; --surface: #161B20; --ink: #E7EBEE; --muted: #8D98A3; --line: #2B343B;
    --accent: #7D9DFF; --accent-ink: #0B1020; --good: #4CC184; --bad: #FF7A74;
    --plate-white: #D5DADF;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1215; --surface: #161B20; --ink: #E7EBEE; --muted: #8D98A3; --line: #2B343B;
  --accent: #7D9DFF; --accent-ink: #0B1020; --good: #4CC184; --bad: #FF7A74;
  --plate-white: #D5DADF;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 120px;
  -webkit-text-size-adjust: 100%;
}
.wrap { max-width: 560px; margin-inline: auto; }
a { color: inherit; }
h1, h2, h3, p, ul, dl, dd { margin: 0; padding: 0; }
ul { list-style: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }

/* hlavička */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-bottom: 18px; }
.top > div { min-width: 0; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 46px; line-height: .95; letter-spacing: -.005em; text-wrap: balance; margin-top: 6px; }
.back { display: inline-flex; align-items: center; min-height: 44px; font-weight: 600; text-decoration: none; color: var(--muted); }
.bar-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }

/* tlačidlá */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 18px; border: 0; border-radius: 6px;
  background: var(--accent); color: var(--accent-ink);
  font: 700 19px/1 var(--font-display); letter-spacing: .02em;
  text-decoration: none; cursor: pointer; white-space: nowrap;
}
.btn.sm { min-height: 40px; padding: 0 14px; font-size: 17px; }
.btn.block { width: 100%; min-height: 54px; font-size: 21px; }
.btn.ghost { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
.btn.bad { background: transparent; color: var(--bad); box-shadow: inset 0 0 0 1.5px var(--bad); }
.btn.solid-bad { background: var(--bad); color: #fff; }
.btn:disabled { opacity: .55; cursor: default; }
.linkbtn { background: none; border: 0; padding: 8px 0; font: 600 15px var(--font-body); color: var(--accent); cursor: pointer; text-align: left; }
.icon-btn { flex: none; width: 44px; height: 44px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: 400 28px/1 var(--font-body); cursor: pointer; }

/* sekcie */
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-top: 2px solid var(--ink); padding-top: 8px; margin-top: 30px; }
.sec h2 { font-family: var(--font-display); font-weight: 700; font-size: 24px; letter-spacing: .01em; }
.sec span { font-size: 13px; color: var(--muted); }

/* kotúč */
.plate {
  --s: 46px; --p: var(--plate-blue); --t: #fff;
  flex: none; width: var(--s); height: var(--s); border-radius: 50%;
  background: var(--p); color: var(--t);
  display: inline-grid; place-items: center;
  box-shadow: inset 0 0 0 calc(var(--s) * .07) rgba(255,255,255,.26), inset 0 0 0 calc(var(--s) * .09) rgba(0,0,0,.16);
  font-family: var(--font-display); font-weight: 800; font-size: calc(var(--s) * .42); letter-spacing: .02em;
}
.plate[data-c="red"] { --p: var(--plate-red); }
.plate[data-c="blue"] { --p: var(--plate-blue); }
.plate[data-c="green"] { --p: var(--plate-green); }
.plate[data-c="yellow"] { --p: var(--plate-yellow); --t: #1B1500; }
.plate[data-c="white"] { --p: var(--plate-white); --t: #1B2026; box-shadow: inset 0 0 0 calc(var(--s) * .07) rgba(0,0,0,.08), inset 0 0 0 calc(var(--s) * .09) rgba(0,0,0,.12); }

/* zoznam klientov */
.crow { display: flex; align-items: center; gap: 14px; min-height: 76px; padding: 12px 0; border-bottom: 1px solid var(--line); text-decoration: none; }
.cmain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.cname { font-family: var(--font-display); font-weight: 700; font-size: 25px; line-height: 1.05; overflow-wrap: anywhere; }
.cmeta { font-size: 13.5px; color: var(--muted); }
.cweek { flex: none; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; text-align: right; }
.dots { display: inline-flex; gap: 4px; }
.dot { width: 10px; height: 10px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--muted); }
.dot.on { background: var(--accent); box-shadow: none; }
.clast { font-size: 12.5px; color: var(--muted); }
.tag { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; border-radius: 4px; background: var(--plate-yellow); color: #1B1500; vertical-align: middle; }

.empty { padding: 28px 0 8px; display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.empty h2 { font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; }
.empty p { color: var(--muted); max-width: 44ch; }
.row-actions { display: flex; flex-wrap: wrap; gap: 10px; }
.note-box { margin-top: 22px; padding: 12px 14px; border-radius: 6px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 14px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }

/* detail klienta */
.ident { display: flex; align-items: center; gap: 16px; margin-top: 8px; }
.ident h1 { margin-top: 0; font-size: 42px; overflow-wrap: anywhere; }
.ident .cmeta { margin-top: 4px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); margin-top: 22px; }
.stat { padding: 2px 0 2px 14px; border-left: 1px solid var(--line); min-width: 0; }
.stat:first-child { padding-left: 0; border-left: 0; }
.stat b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 34px; line-height: 1; }
.stat span { display: block; margin-top: 4px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.cta { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; }

.facts { display: grid; grid-template-columns: 1fr 1fr; column-gap: 20px; margin-top: 8px; }
.fact { padding: 10px 0; border-bottom: 1px solid var(--line); min-width: 0; }
.fact dt { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.fact dd { margin-top: 2px; overflow-wrap: anywhere; }
.fact.wide { grid-column: 1 / -1; }

/* progres */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { border: 0; border-radius: 999px; padding: 8px 14px; min-height: 38px; background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); font: 600 14px var(--font-body); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); box-shadow: none; }
.chart { margin-top: 14px; }
.chart svg { display: block; width: 100%; height: auto; overflow: visible; }
.g-grid { stroke: var(--line); stroke-width: 1; fill: none; }
.g-tick { fill: var(--muted); font: 500 11px var(--font-body); }
.g-line { stroke: var(--accent); stroke-width: 2.5; fill: none; stroke-linejoin: round; stroke-linecap: round; }
.g-area { fill: var(--accent); fill-opacity: .12; stroke: none; }
.g-dot { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
.g-goal { stroke: var(--good); stroke-width: 1.5; stroke-dasharray: 5 4; fill: none; }
.g-goal-t { fill: var(--good); font: 600 11px var(--font-body); }
.g-val { fill: var(--ink); font: 800 17px var(--font-display); }
.sumrow { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; margin-top: 8px; border-top: 1px solid var(--line); }
.sum { padding: 10px 0 0 14px; border-left: 1px solid var(--line); min-width: 0; }
.sum:first-child { padding-left: 0; border-left: 0; }
.sum span { display: block; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.sum b { display: block; font-family: var(--font-display); font-weight: 800; font-size: 28px; line-height: 1.1; }
.good { color: var(--good); }
.bad-t { color: var(--bad); }
.hint { margin-top: 14px; color: var(--muted); }

/* história */
.entry { border-bottom: 1px solid var(--line); }
.elink { display: grid; grid-template-columns: 54px 1fr; gap: 12px; padding: 14px 0 8px; text-decoration: none; }
.eact { padding: 0 0 6px 66px; }
.eact .linkbtn { min-height: 40px; display: inline-flex; align-items: center; }
.dup-note { margin-top: 12px; padding: 10px 14px; border-radius: 6px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); font-size: 14.5px; }
.edate { display: flex; flex-direction: column; align-items: flex-start; line-height: 1; }
.edate b { font-family: var(--font-display); font-weight: 800; font-size: 34px; }
.edate span { margin-top: 3px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ebody { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.meas { display: flex; flex-wrap: wrap; gap: 6px; }
.meas span { font-size: 13px; font-weight: 600; padding: 2px 9px; border-radius: 4px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); }
.exl { display: flex; flex-direction: column; gap: 2px; }
.exl li { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.exl .en { font-weight: 600; overflow-wrap: anywhere; }
.exl .ev { color: var(--muted); font-size: 14.5px; }
.pr { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 1px 6px; border-radius: 4px; background: var(--plate-yellow); color: #1B1500; }
.enote { font-size: 14.5px; color: var(--muted); font-style: italic; overflow-wrap: anywhere; }

/* formuláre */
form { display: flex; flex-direction: column; gap: 16px; margin-top: 18px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .lab { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input, select, textarea {
  font: inherit; font-size: 16px; color: var(--ink); background: var(--surface);
  border: 0; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line);
  padding: 12px; min-height: 48px; width: 100%; min-width: 0;
}
textarea { min-height: 88px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 0; }
.plates { display: flex; flex-wrap: wrap; gap: 12px; }
.plates label { cursor: pointer; display: inline-block; }
.plates input { position: absolute; opacity: 0; width: 1px; height: 1px; min-height: 0; }
.plates .plate { --s: 46px; outline: 3px solid transparent; outline-offset: 3px; }
.plates input:checked + .plate { outline-color: var(--ink); }
.plates input:focus-visible + .plate { outline-color: var(--accent); }

.ex { display: grid; grid-template-columns: 1fr auto; gap: 8px 4px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.ex-prev { grid-column: 1 / -1; margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; padding: 7px 10px; border-radius: 6px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--line); font-size: 14.5px; }
.ex-prev span { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.ex-prev b { font-weight: 700; overflow-wrap: anywhere; }
.ex .ins { grid-column: 1 / -1; justify-self: start; min-height: 36px; padding: 6px 0; }
.ex:last-child .ins { display: none; }
.ex .ex-nums { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.ex .ex-nums label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.ex-list { display: flex; flex-direction: column; }
.err { color: var(--bad); font-weight: 600; }
.danger { margin-top: 26px; padding-top: 16px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.danger p { font-weight: 600; }

.fixbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(12px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: var(--bg); border-top: 1px solid var(--line);
}
.fixbar > div { max-width: 560px; margin-inline: auto; }
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 9;
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  max-width: min(520px, calc(100% - 32px)); padding: 12px 16px; border-radius: 6px;
  background: var(--ink); color: var(--bg); font-weight: 600; font-size: 14.5px;
}
.loading { padding: 40px 0; color: var(--muted); }
@media (max-width: 380px) {
  h1 { font-size: 40px; }
  .ident h1 { font-size: 36px; }
  .stat b { font-size: 30px; }
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<input type="file" id="imp" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" hidden></div>

<script>
(function () {
  'use strict';

  var app = document.getElementById('app');
  var toastEl = document.getElementById('toast');
  var S = { mode: 'boot', ready: false, uid: null, clients: [], entries: [], metric: {}, dl: null, mounted: null, fail: false };
  var DB = null;
  var LS = 'trenersky-dennik-v1';
  var COMMON = ['Drep', 'Mŕtvy ťah', 'Rumunský mŕtvy ťah', 'Tlak na lavičke', 'Tlak s jednoručkami', 'Tlak na ramená', 'Veslovanie', 'Stiahnutie hornej kladky', 'Výpady', 'Leg press', 'Hip thrust', 'Biceps zdvih', 'Triceps na kladke'];
  var PLATES = [['red', 'Červená'], ['blue', 'Modrá'], ['yellow', 'Žltá'], ['green', 'Zelená'], ['white', 'Biela']];
  var LEVELS = [['zaciatocna', 'Začiatočná'], ['mierne', 'Mierne pokročilá'], ['pokrocila', 'Pokročilá']];

  /* ---------- pomocné funkcie ---------- */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  var nf = new Intl.NumberFormat('sk-SK', { maximumFractionDigits: 1, useGrouping: false });
  function fmt(n) { return nf.format(n); }
  function signed(n) { return (n > 0 ? '+' : n < 0 ? '−' : '±') + nf.format(Math.abs(n)); }
  function pad(n) { return String(n).padStart(2, '0'); }
  function toISO(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayISO() { return toISO(new Date()); }
  function dObj(iso) { return new Date(iso + 'T12:00:00'); }
  function addDays(iso, n) { var d = dObj(iso); d.setDate(d.getDate() + n); return toISO(d); }
  function daysBetween(a, b) { return Math.round((dObj(b) - dObj(a)) / 864e5); }
  function mondayOf(iso) { var d = dObj(iso); d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); return toISO(d); }
  var fFull = new Intl.DateTimeFormat('sk-SK', { weekday: 'long', day: 'numeric', month: 'long' });
  var fShort = new Intl.DateTimeFormat('sk-SK', { day: 'numeric', month: 'numeric' });
  var fMon = new Intl.DateTimeFormat('sk-SK', { month: 'short' });
  var fDay = new Intl.DateTimeFormat('sk-SK', { day: 'numeric' });
  function uid8() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function num(v) {
    if (v == null) return null;
    v = String(v).trim().replace(',', '.');
    if (v === '') return null;
    var n = Number(v);
    return isNaN(n) ? null : n;
  }
  function relDay(iso) {
    var n = daysBetween(iso, todayISO());
    if (n <= 0) return 'dnes';
    if (n === 1) return 'včera';
    if (n < 14) return 'pred ' + n + ' dňami';
    if (n < 60) return 'pred ' + Math.floor(n / 7) + ' týždňami';
    return 'pred ' + Math.round(n / 30) + ' mes.';
  }
  function levelLabel(k) { var l = LEVELS.filter(function (x) { return x[0] === k; })[0]; return l ? l[1].toLowerCase() + ' úroveň' : ''; }
  function initials(name) {
    var p = String(name || '?').trim().split(/\s+/);
    var s = (p[0] || '?').charAt(0) + (p.length > 1 ? p[p.length - 1].charAt(0) : '');
    return s.toUpperCase();
  }
  function plate(c, size) {
    return '<span class="plate" aria-hidden="true" data-c="' + esc(c.plate || 'blue') + '" style="--s:' + (size || 46) + 'px">' + esc(initials(c.name)) + '</span>';
  }
  function toast(msg) {
    toastEl.textContent = msg; toastEl.hidden = false;
    clearTimeout(toast.t); toast.t = setTimeout(function () { toastEl.hidden = true; }, 3200);
  }
  function hasEx(e) { return Array.isArray(e.exercises) && e.exercises.length > 0; }
  var PLAIN = /^-?\d+([.,]\d+)?$/;
  function numOf(v) {
    if (typeof v === 'number') return isFinite(v) ? v : 0;
    var m = String(v == null ? '' : v).replace(',', '.').match(/-?\d+(?:\.\d+)?/);
    return m ? parseFloat(m[0]) : 0;
  }
  function cellVal(v) { return (v === 0 || v == null) ? '' : v; }
  function cellIn(v) {
    v = String(v == null ? '' : v).trim();
    if (!v) return 0;
    return PLAIN.test(v) ? Number(v.replace(',', '.')) : v;
  }
  function kgText(v) {
    if (v === 0 || v == null || v === '') return '';
    if (typeof v === 'number') return fmt(v) + ' kg';
    var s = String(v).trim();
    return PLAIN.test(s) ? s.replace('.', ',') + ' kg' : s;
  }
  function entriesOf(cid) {
    return S.entries.filter(function (e) { return e.clientId === cid; }).sort(function (a, b) {
      return a.date < b.date ? -1 : a.date > b.date ? 1 : (a.createdAt || 0) - (b.createdAt || 0);
    });
  }
  function weekDone(cid) {
    var wk = mondayOf(todayISO()), end = addDays(wk, 6);
    return S.entries.filter(function (e) { return e.clientId === cid && hasEx(e) && e.date >= wk && e.date <= end; }).length;
  }
  function exerciseStats(es) {
    var m = {}, out = [];
    es.forEach(function (e) {
      (e.exercises || []).forEach(function (x) {
        var k = String(x.name || '').trim().toLowerCase();
        if (!k) return;
        if (!m[k]) { m[k] = { key: k, name: String(x.name).trim(), n: 0 }; out.push(m[k]); }
        m[k].n++;
      });
    });
    return out.sort(function (a, b) { return b.n - a.n || a.name.localeCompare(b.name, 'sk'); });
  }
  function prFlags(es) {
    var best = {}, flags = {};
    es.forEach(function (e) {
      (e.exercises || []).forEach(function (x) {
        var k = String(x.name || '').trim().toLowerCase(), kg = numOf(x.kg);
        if (!k || kg <= 0) return;
        if (best[k] != null && kg > best[k]) { (flags[e.id] = flags[e.id] || {})[k] = true; }
        if (best[k] == null || kg > best[k]) best[k] = kg;
      });
    });
    return flags;
  }

  /* ---------- ukladanie ---------- */
  function ref(coll) { return DB.doc('data/users/' + S.uid + '/profile').collection(coll); }
  function saveLocal() {

  }

  }
  function applyLocal(coll, id, data) {
    var arr = S[coll], row = Object.assign({ id: id }, data), i = -1;
    arr.forEach(function (x, k) { if (x.id === id) i = k; });
    if (i >= 0) arr[i] = row; else arr.push(row);
  }
  async function put(coll, id, data) {
    if (DB) await ref(coll).doc(id).set(data);
    applyLocal(coll, id, data);

  async function del(coll, id) {

  }

  /* ---------- graf ---------- */
  function niceStep(range, target) {
    var raw = range / target, p = Math.pow(10, Math.floor(Math.log10(raw))), f = raw / p;
    return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * p;
  }
  function lineChart(pts, o) {
    o = o || {};
    if (!pts.length) return '';
    var W = 340, H = 200, L = 42, R = 20, T = 26, B = 30;
    var vals = pts.map(function (p) { return p.y; });
    if (o.goal != null) vals.push(o.goal);
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if (hi === lo) { var d0 = Math.max(1, Math.abs(hi) * 0.1); lo -= d0; hi += d0; }
    var padv = (hi - lo) * 0.14; lo -= padv; hi += padv;
    var step = niceStep(hi - lo, 3), ticks = [];
    for (var v = Math.ceil(lo / step) * step; v <= hi + 1e-9; v += step) ticks.push(+v.toFixed(6));
    var t0 = dObj(pts[0].x).getTime(), t1 = dObj(pts[pts.length - 1].x).getTime();
    function px(x) { return t1 === t0 ? L + (W - L - R) / 2 : L + (dObj(x).getTime() - t0) / (t1 - t0) * (W - L - R); }
    function py(y) { return T + (1 - (y - lo) / (hi - lo)) * (H - T - B); }
    var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + esc(o.label || 'Graf') + '">';
    ticks.forEach(function (t) {
      s += '<line class="g-grid" x1="' + L + '" x2="' + (W - R) + '" y1="' + py(t).toFixed(1) + '" y2="' + py(t).toFixed(1) + '"/>';
      s += '<text class="g-tick" x="' + (L - 8) + '" y="' + (py(t) + 4).toFixed(1) + '" text-anchor="end">' + fmt(t) + '</text>';
    });
    if (o.goal != null) {
      s += '<line class="g-goal" x1="' + L + '" x2="' + (W - R) + '" y1="' + py(o.goal).toFixed(1) + '" y2="' + py(o.goal).toFixed(1) + '"/>';
      s += '<text class="g-goal-t" x="' + (L + 4) + '" y="' + (py(o.goal) - 5).toFixed(1) + '">cieľ ' + fmt(o.goal) + ' ' + esc(o.unit) + '</text>';
    }
    var line = pts.map(function (p, i) { return (i ? 'L' : 'M') + px(p.x).toFixed(1) + ' ' + py(p.y).toFixed(1); }).join(' ');
    if (pts.length > 1) {
      s += '<path class="g-area" d="' + line + ' L' + px(pts[pts.length - 1].x).toFixed(1) + ' ' + (H - B) + ' L' + px(pts[0].x).toFixed(1) + ' ' + (H - B) + ' Z"/>';
      s += '<path class="g-line" d="' + line + '"/>';
    }
    pts.forEach(function (p, i) {
      var last = i === pts.length - 1;
      s += '<circle class="g-dot" cx="' + px(p.x).toFixed(1) + '" cy="' + py(p.y).toFixed(1) + '" r="' + (last ? 6 : 3.5) + '"/>';
    });
    var lp = pts[pts.length - 1];
    s += '<text class="g-val" x="' + Math.min(px(lp.x) + 8, W - 2).toFixed(1) + '" y="' + (py(lp.y) - 11).toFixed(1) + '" text-anchor="end">' + fmt(lp.y) + ' ' + esc(o.unit) + '</text>';
    var by = H - 8;
    if (pts.length === 1 || t1 === t0) {
      s += '<text class="g-tick" x="' + px(pts[0].x).toFixed(1) + '" y="' + by + '" text-anchor="middle">' + fShort.format(dObj(pts[0].x)) + '</text>';
    } else {
      s += '<text class="g-tick" x="' + L + '" y="' + by + '" text-anchor="start">' + fShort.format(dObj(pts[0].x)) + '</text>';
      s += '<text class="g-tick" x="' + (W - R) + '" y="' + by + '" text-anchor="end">' + fShort.format(dObj(lp.x)) + '</text>';
    }
    return s + '</svg>';
  }
  function toPts(m) {
    return Object.keys(m).sort().map(function (k) { return { x: k, y: m[k] }; });
  }
  function seriesFor(c, es, key) {
    var m = {};
    if (key === 'weight') {
      if (c.startWeight != null) m[c.startDate || todayISO()] = c.startWeight;
      es.forEach(function (e) { if (e.weight != null) m[e.date] = e.weight; });
      return { pts: toPts(m), unit: 'kg', kind: 'weight' };
    }
    if (key === 'waist') {
      es.forEach(function (e) { if (e.waist != null) m[e.date] = e.waist; });
      return { pts: toPts(m), unit: 'cm', kind: 'waist' };
    }
    var k = key.slice(3), rows = [];
    es.forEach(function (e) {
      (e.exercises || []).forEach(function (x) {
        if (String(x.name || '').trim().toLowerCase() === k) rows.push({ date: e.date, kg: numOf(x.kg), vol: (numOf(x.sets) || 1) * numOf(x.reps) });
      });
    });
    var reps = rows.length > 0 && rows.every(function (r) { return r.kg === 0; });
    rows.forEach(function (r) {
      var v = reps ? r.vol : r.kg;
      m[r.date] = m[r.date] == null ? v : Math.max(m[r.date], v);
    });
    return { pts: toPts(m), unit: reps ? 'opak.' : 'kg', kind: 'ex' };
  }
  function metricsFor(c, es) {
    var out = [];
    if (seriesFor(c, es, 'weight').pts.length) out.push({ key: 'weight', label: 'Hmotnosť' });
    if (seriesFor(c, es, 'waist').pts.length) out.push({ key: 'waist', label: 'Pás' });
    exerciseStats(es).forEach(function (x) { out.push({ key: 'ex:' + x.key, label: x.name }); });
    return out;
  }
  function progressInner(c) {
    var es = entriesOf(c.id), ms = metricsFor(c, es);
    if (!ms.length) return '<p class="hint">Po prvom zápise sa tu zobrazí graf hmotnosti, pásu a zdvíhaných kíl pri jednotlivých cvikoch.</p>';
    var cur = S.metric[c.id];
    if (!ms.some(function (m) { return m.key === cur; })) cur = ms[0].key;
    var meta = ms.filter(function (m) { return m.key === cur; })[0];
    var sr = seriesFor(c, es, cur), pts = sr.pts;
    var first = pts[0].y, last = pts[pts.length - 1].y, delta = last - first;
    var goal = (cur === 'weight' && c.goalWeight != null) ? c.goalWeight : null;
    var cls = '';
    if (sr.kind === 'weight' || sr.kind === 'waist') {
      var gw = c.goalWeight, sw = c.startWeight != null ? c.startWeight : null;
      if (gw != null && sw != null && delta !== 0) cls = (gw < sw) === (delta < 0) ? 'good' : 'bad-t';
    } else if (delta > 0) cls = 'good';
    var chips = '<div class="chips" role="group" aria-label="Čo sledovať">' + ms.map(function (m) {
      return '<button type="button" class="chip" data-act="metric" data-cid="' + esc(c.id) + '" data-key="' + esc(m.key) + '" aria-pressed="' + (m.key === cur) + '">' + esc(m.label) + '</button>';
    }).join('') + '</div>';
    var labels = sr.kind === 'ex' ? ['Prvý zápis', 'Rekord', 'Zmena'] : [sr.kind === 'weight' ? 'Štart' : 'Prvé meranie', 'Teraz', 'Zmena'];
    var mid = sr.kind === 'ex' ? Math.max.apply(null, pts.map(function (p) { return p.y; })) : last;
    var sum = '<div class="sumrow">' +
      '<div class="sum"><span>' + labels[0] + '</span><b class="num">' + fmt(first) + ' <small>' + esc(sr.unit) + '</small></b></div>' +
      '<div class="sum"><span>' + labels[1] + '</span><b class="num">' + fmt(mid) + ' <small>' + esc(sr.unit) + '</small></b></div>' +
      '<div class="sum"><span>' + labels[2] + '</span><b class="num ' + cls + '">' + (pts.length > 1 ? signed(delta) + ' <small>' + esc(sr.unit) + '</small>' : '–') + '</b></div></div>';
    return chips + '<div class="chart">' + lineChart(pts, { unit: sr.unit, goal: goal, label: meta.label + ': od ' + fmt(first) + ' do ' + fmt(last) + ' ' + sr.unit }) + '</div>' + sum;
  }

  }
  function lastTraining(cid, exceptId) {
    var t = entriesOf(cid).filter(function (e) { return hasEx(e) && e.id !== exceptId; });
    return t.length ? t[t.length - 1] : null;
  }
  function entryFormView(cid, eid, from) {
    var c = S.clients.filter(function (x) { return x.id === cid; })[0];
    if (!c) return notFound();
    var e = eid ? S.entries.filter(function (x) { return x.id === eid; })[0] : null;
    if (eid && !e) return notFound();
    var src = from ? S.entries.filter(function (x) { return x.id === from; })[0] : null;
    if (from && !src) return notFound();
    var v = e || (src ? { date: todayISO(), exercises: JSON.parse(JSON.stringify(src.exercises || [])) } : { date: todayISO(), exercises: [{ sets: 3, reps: 10 }] });
    var rows = (v.exercises && v.exercises.length ? v.exercises : [{ sets: 3, reps: 10 }]).map(function (x) { return rowHtml(x, src ? x : null); }).join('');
    var names = exerciseStats(entriesOf(cid)).map(function (x) { return x.name; });
    COMMON.forEach(function (n) { if (names.map(function (x) { return x.toLowerCase(); }).indexOf(n.toLowerCase()) < 0) names.push(n); });
    var last = lastTraining(cid, eid);
    var h = '<div class="bar-top"><a class="back" href="#k-' + esc(cid) + '">← ' + esc(c.name) + '</a></div>';
    h += '<h1 style="font-size:38px">' + (e ? 'Upraviť záznam' : src ? 'Duplikovaný tréning' : 'Nový záznam') + '</h1>';
    if (src) h += '<p class="dup-note">Cviky sú skopírované z tréningu ' + esc(fShort.format(dObj(src.date))) + ' Prepíš váhu a opakovania. Pod názvom cviku vidíš, čo si zdvíhal minule.</p>';
    h += '<form id="entry-form" data-cid="' + esc(cid) + '" data-eid="' + esc(eid || '') + '" autocomplete="off" novalidate>';
    h += field('e-date', 'Dátum', inp('e-date', 'date', v.date, 'required'));
    h += '<div class="grid2">' + field('e-weight', 'Hmotnosť (kg)', inp('e-weight', 'number', v.weight, 'inputmode="decimal" min="20" max="300" step="any" placeholder="voliteľné"')) +
      field('e-waist', 'Obvod pásu (cm)', inp('e-waist', 'number', v.waist, 'inputmode="decimal" min="30" max="250" step="any" placeholder="voliteľné"')) + '</div>';
    h += '<div class="sec" style="margin-top:8px"><h2>Cviky</h2>' + (last ? '<button type="button" class="linkbtn" data-act="copy-last" data-cid="' + esc(cid) + '" data-eid="' + esc(eid || '') + '">Skopírovať posledný tréning</button>' : '') + '</div>';
    h += '<div class="ex-list" id="ex-list">' + rows + '</div>';
    h += '<datalist id="ex-names">' + names.map(function (n) { return '<option value="' + esc(n) + '"></option>'; }).join('') + '</datalist>';
    h += '<div><button type="button" class="btn ghost" data-act="add-row">+ Pridať cvik</button></div>';
    h += field('e-note', 'Poznámka', '<textarea id="e-note" name="e-note" placeholder="Ako to šlo, čo zmeniť nabudúce">' + esc(v.note || '') + '</textarea>');
    h += '<p class="err" id="form-err" role="alert" hidden></p></form>';
    if (e) h += '<div class="danger" id="danger"><button type="button" class="btn bad" data-act="del-ask" data-kind="entry" data-id="' + esc(e.id) + '" data-cid="' + esc(cid) + '">Vymazať záznam</button></div>';
    h += '<div class="fixbar"><div><button class="btn block" type="submit" form="entry-form" id="save-btn">Uložiť záznam</button></div></div>';
    return h;
  }

  /* ---------- záloha ---------- */
  var BK = 'trenersky-dennik-backup';
  function lastBackup() { try { return localStorage.getItem(BK) || ''; } catch (e) { return ''; } }
  function backupBox() {
    var lb = lastBackup(), days = lb ? daysBetween(lb, todayISO()) : null;
    var warn = S.entries.length && (days === null || days > 14);
    var info = lb ? 'Posledná záloha: ' + fShort.format(dObj(lb)) + ' (' + relDay(lb) + ').' : 'Zatiaľ nie je stiahnutá žiadna záloha.';
    return '<div class="sec"><h2>Záloha</h2></div><div class="note-box" style="margin-top:10px"><span>' + info + (warn ? ' Stiahni si ju, nech o údaje neprídeš.' : '') + '</span>' +
      '<div class="row-actions"><button type="button" class="btn sm" data-act="backup">Stiahnuť zálohu</button><label class="btn sm ghost" for="imp">Načítať zálohu</label><button type="button" class="btn sm ghost" data-act="export">Tabuľka (CSV)</button></div></div>';
  }
  async function saveFile(name, text, mime) {
    var blob = new Blob([text], { type: mime });
    try {
      var file = new File([blob], name, { type: mime });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file], title: name }); return true; }
    } catch (e) { if (e && e.name === 'AbortError') return false; }
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    return true;
  }
  async function backupJson() {
    var data = { app: 'trenersky-dennik', version: 1, exportedAt: new Date().toISOString(), clients: S.clients, entries: S.entries };
    try {
      var ok = await saveFile('trenersky-dennik-zaloha-' + todayISO() + '.json', JSON.stringify(data), 'application/json');
      if (ok) { try { localStorage.setItem(BK, todayISO()); } catch (e) { } toast('Záloha je pripravená.'); render(); }
    } catch (e) { toast('Zálohu sa nepodarilo uložiť.'); }
  }
  function importBackup(file) {
    var rd = new FileReader();
    rd.onload = function () {
      try {
        var j = JSON.parse(String(rd.result)), nc = 0, ne = 0;
        if (!j || j.app !== 'trenersky-dennik' || !Array.isArray(j.clients) || !Array.isArray(j.entries)) throw new Error('format');
        j.clients.forEach(function (c) { if (c && c.id && c.name) { var d = Object.assign({}, c); delete d.id; applyLocal('clients', c.id, d); nc++; } });
        j.entries.forEach(function (e) { if (e && e.id && e.clientId && e.date) { var d = Object.assign({}, e); delete d.id; applyLocal('entries', e.id, d); ne++; } });
        saveLocal(); render();
        toast('Záloha načítaná. Klienti: ' + nc + ', záznamy: ' + ne + '.');
      } catch (e) { toast('Tento súbor sa nepodarilo načítať ako zálohu denníka.'); }
    };
    rd.readAsText(file);
  }
  document.getElementById('imp').addEventListener('change', function (ev) {
    var f = ev.target.files && ev.target.files[0];
    if (f) importBackup(f);
    ev.target.value = '';
  });

  /* ---------- smerovanie a vykresľovanie ---------- */
  function parseRoute() {
    var h = location.hash.replace(/^#/, ''), p = h.split('-');
    if (!h) return { v: 'list' };
    if (p[0] === 'k' && p[1]) return { v: 'client', id: p[1] };
    if (h === 'novy') return { v: 'cform' };
    if (p[0] === 'uprav' && p[1]) return { v: 'cform', id: p[1] };
    if (p[0] === 'z' && p[1]) return { v: 'eform', cid: p[1], eid: p[2] };
    if (p[0] === 'd' && p[1] && p[2]) return { v: 'eform', cid: p[1], from: p[2] };
    return { v: 'list' };
  }
  function render() {
    var r = parseRoute(), html;
    if (S.fail) html = errorView();
    else if (!S.ready) html = loadingView();
    else if (r.v === 'client') html = clientView(r.id);
    else if (r.v === 'cform') html = clientFormView(r.id);
    else if (r.v === 'eform') html = entryFormView(r.cid, r.eid, r.from);
    else html = listView();
    app.innerHTML = html;
    S.mounted = S.ready ? location.hash : null;
  }
  function onData() {
    var r = parseRoute();
    if (r.v === 'cform' || r.v === 'eform') { if (S.mounted !== location.hash) render(); return; }
    render();
  }
  window.addEventListener('hashchange', function () { render(); window.scrollTo(0, 0); });

  /* ---------- akcie ---------- */
  function showErr(msg) { var el = document.getElementById('form-err'); if (el) { el.textContent = msg; el.hidden = false; } }
  function setBusy(b) { var btn = document.getElementById('save-btn'); if (btn) btn.disabled = b; }

  document.addEventListener('submit', async function (ev) {
    var f = ev.target;
    if (f.id !== 'client-form' && f.id !== 'entry-form') return;
    ev.preventDefault();
    setBusy(true);
    try {
      if (f.id === 'client-form') {
        var r = parseRoute(), old = r.id ? S.clients.filter(function (x) { return x.id === r.id; })[0] : null;
        var name = f.elements['c-name'].value.trim();
        if (!name) { showErr('Zadaj meno klienta.'); setBusy(false); return; }
        var plateEl = f.querySelector('input[name="plate"]:checked');
        var data = {
          name: name, plate: plateEl ? plateEl.value : 'blue',
          born: num(f.elements['c-born'].value), height: num(f.elements['c-height'].value),
          startWeight: num(f.elements['c-sw'].value), startDate: f.elements['c-sd'].value || todayISO(),
          goalWeight: num(f.elements['c-gw'].value), goal: f.elements['c-goal'].value.trim(),
          level: f.elements['c-level'].value, perWeek: +f.elements['c-week'].value,
          phone: f.elements['c-phone'].value.trim(), notes: f.elements['c-notes'].value.trim(),
          demo: !!(old && old.demo), createdAt: old ? (old.createdAt || Date.now()) : Date.now()
        };
        var id = old ? old.id : uid8();
        await put('clients', id, data);
        location.hash = 'k-' + id;
      } else {
        var cid = f.dataset.cid, eid = f.dataset.eid || uid8(), isNew = !f.dataset.eid;
        var prev = isNew ? null : S.entries.filter(function (x) { return x.id === eid; })[0];
        var ex = [].slice.call(f.querySelectorAll('.ex')).map(function (row) {
          return {
            name: row.querySelector('.ex-name').value.trim(),
            sets: num(row.querySelector('.ex-sets').value) || 0,
            reps: cellIn(row.querySelector('.ex-reps').value),
            kg: cellIn(row.querySelector('.ex-kg').value)
          };
        }).filter(function (x) { return x.name; });
        var weight = num(f.elements['e-weight'].value), waist = num(f.elements['e-waist'].value);
        var date = f.elements['e-date'].value;
        if (!date) { showErr('Vyber dátum.'); setBusy(false); return; }
        if (!ex.length && weight == null && waist == null) { showErr('Zapíš aspoň hmotnosť, pás alebo jeden cvik.'); setBusy(false); return; }
        await put('entries', eid, {
          clientId: cid, date: date, weight: weight, waist: waist, exercises: ex,
          note: f.elements['e-note'].value.trim(), createdAt: prev ? (prev.createdAt || Date.now()) : Date.now()
        });
        S.metric[cid] = S.metric[cid];
        location.hash = 'k-' + cid;
      }
    } catch (err) {
      setBusy(false);
      showErr(err && err.code === 'quota_exceeded' ? 'Úložisko je plné. Vymaž staré záznamy.' : 'Uloženie sa nepodarilo. Skús to znova.');
    }
  });

  function addRow() {
    var list = document.getElementById('ex-list'); if (!list) return;
    list.insertAdjacentHTML('beforeend', rowHtml({ sets: 3, reps: 10 }));
    var rows = list.querySelectorAll('.ex-name'); rows[rows.length - 1].focus();
  }
  function copyLast(t) {
    var le = lastTraining(t.dataset.cid, t.dataset.eid || null), list = document.getElementById('ex-list');
    if (!le || !list) return;
    list.innerHTML = le.exercises.map(function (x) { return rowHtml(x, x); }).join('');
    toast('Cviky z ' + fShort.format(dObj(le.date)) + ' sú vložené. Uprav váhy.');
  }
  function askDelete(t) {
    var box = document.getElementById('danger'); if (!box) return;
    var what = t.dataset.kind === 'client' ? 'Vymazať klienta aj všetky jeho záznamy?' : 'Naozaj vymazať tento záznam?';
    box.innerHTML = '<p>' + what + '</p><div class="row-actions"><button type="button" class="btn solid-bad" data-act="del-yes" data-kind="' + esc(t.dataset.kind) + '" data-id="' + esc(t.dataset.id) + '" data-cid="' + esc(t.dataset.cid || '') + '">Áno, vymazať</button><button type="button" class="btn ghost" data-act="del-no" data-kind="' + esc(t.dataset.kind) + '" data-id="' + esc(t.dataset.id) + '" data-cid="' + esc(t.dataset.cid || '') + '">Nie</button></div>';
  }
  function cancelDelete(t) {
    var box = document.getElementById('danger'); if (!box) return;
    box.innerHTML = '<button type="button" class="btn bad" data-act="del-ask" data-kind="' + esc(t.dataset.kind) + '" data-id="' + esc(t.dataset.id) + '" data-cid="' + esc(t.dataset.cid || '') + '">' + (t.dataset.kind === 'client' ? 'Vymazať klienta' : 'Vymazať záznam') + '</button>';
  }
  async function removeClient(id) {
    var es = S.entries.filter(function (e) { return e.clientId === id; });
    for (var i = 0; i < es.length; i++) await del('entries', es[i].id);
    await del('clients', id);
  }
  async function confirmDelete(t) {
    try {
      if (t.dataset.kind === 'client') { await removeClient(t.dataset.id); location.hash = ''; }
      else { await del('entries', t.dataset.id); location.hash = 'k-' + t.dataset.cid; }
      if (location.hash === '' || location.hash === '#') render();
    } catch (e) { toast('Vymazanie sa nepodarilo. Skús to znova.'); }
  }
  async function loadDemo() {
    try {
      var cid = uid8(), today = todayISO();
      await put('clients', cid, {
        name: 'Zuzana K.', plate: 'red', born: 1992, height: 168, startWeight: 74, startDate: addDays(today, -35),
        goalWeight: 68, goal: 'Schudnúť 6 kg a zlepšiť silu nôh', level: 'zaciatocna', perWeek: 2, phone: '',
        notes: 'Pravé koleno: nezaťažovať hlbokým drepom.', demo: true, createdAt: Date.now()
      });
      var w = [74, 73.6, 73.1, 72.8, 72.2, 72, 71.4, 71.1, 70.6, 70.4];
      var squat = [20, 20, 22.5, 25, 25, 27.5, 30, 30, 32.5, 35], row = [15, 15, 17.5, 17.5, 20, 20, 22.5, 22.5, 25, 25], hip = [30, 35, 35, 40, 45, 45, 50, 50, 55, 60];
      for (var i = 0; i < 10; i++) {
        await put('entries', uid8(), {
          clientId: cid, date: addDays(today, -Math.round(35 - i * (32 / 9))), weight: w[i], waist: i % 3 === 0 ? 84 - i * 0.4 : null,
          exercises: [{ name: 'Drep', sets: 3, reps: 10, kg: squat[i] }, { name: 'Veslovanie', sets: 3, reps: 10, kg: row[i] }, { name: 'Hip thrust', sets: 3, reps: 12, kg: hip[i] }],
          note: i === 9 ? 'Drep išiel čisto, ďalej pridať 2,5 kg.' : '', createdAt: Date.now() + i
        });
      }
      render();
    } catch (e) { toast('Ukážku sa nepodarilo vytvoriť.'); }
  }
  async function clearDemo() {
    try {
      var ids = S.clients.filter(function (c) { return c.demo; }).map(function (c) { return c.id; });
      for (var i = 0; i < ids.length; i++) await removeClient(ids[i]);
      render();
    } catch (e) { toast('Ukážku sa nepodarilo vymazať.'); }
  }
  function csvCell(v) {
    var s = String(v == null ? '' : v);
    return /[";\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }
  function cnum(n) { return n == null ? '' : String(n).replace('.', ','); }
  function cellCsv(v) { return typeof v === 'number' ? cnum(v) : (v == null ? '' : v); }
  async function exportCsv() {
    var names = {}; S.clients.forEach(function (c) { names[c.id] = c.name; });
    var rows = [['Klient', 'Dátum', 'Hmotnosť (kg)', 'Pás (cm)', 'Cvik', 'Série', 'Opakovania', 'Váha (kg)', 'Poznámka']];
    S.entries.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }).forEach(function (e) {
      var nm = names[e.clientId] || '';
      if (hasEx(e)) e.exercises.forEach(function (x) { rows.push([nm, e.date, cnum(e.weight), cnum(e.waist), x.name, x.sets, cellCsv(x.reps), cellCsv(x.kg), e.note]); });
      else rows.push([nm, e.date, cnum(e.weight), cnum(e.waist), '', '', '', '', e.note]);
    });
    try { await saveFile('trenersky-dennik-' + todayISO() + '.csv', '\uFEFF' + rows.map(function (r) { return r.map(csvCell).join(';'); }).join('\r\n'), 'text/csv;charset=utf-8'); }
    catch (e) { toast('Súbor sa nepodarilo uložiť.'); }
  }

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]'); if (!t) return;
    var a = t.dataset.act;
    if (a === 'metric') {
      S.metric[t.dataset.cid] = t.dataset.key;
      var c = S.clients.filter(function (x) { return x.id === t.dataset.cid; })[0], box = document.getElementById('progress');
      if (c && box) box.innerHTML = progressInner(c);
    }
    else if (a === 'add-row') addRow();
    else if (a === 'ins-row') {
      var cur = t.closest('.ex');
      if (cur) { cur.insertAdjacentHTML('afterend', rowHtml({ sets: 3 })); cur.nextElementSibling.querySelector('.ex-name').focus(); }
    }
    else if (a === 'rm-row') { var row = t.closest('.ex'); if (row) row.remove(); }
    else if (a === 'copy-last') copyLast(t);
    else if (a === 'del-ask') askDelete(t);
    else if (a === 'del-no') cancelDelete(t);
    else if (a === 'del-yes') confirmDelete(t);
    else if (a === 'demo-load') loadDemo();
    else if (a === 'demo-clear') clearDemo();
    else if (a === 'export') exportCsv();
    else if (a === 'backup') backupJson();
  });

  /* ---------- štart ---------- */
  function boot() {
    S.mode = 'local'; loadLocal(); S.ready = true; render();
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
    if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) {
      navigator.serviceWorker.register('sw.js').catch(function () { });
    }
  }
  boot();
})();
</script>
</body>
</html>
